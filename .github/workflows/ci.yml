# CI — tubermed-web
#
# Gates on every push to master and every PR:
#   1. the lint RATCHET, tsc --noEmit, and the node --test suite.
#
# ⚠ The lint step runs `npm run lint:ratchet`, NOT bare `npm run lint`
#   (2026-08-19). Bare eslint exits 1 on any error and this repo carries 21
#   accepted pre-existing react-hooks findings, so this job was RED ON master
#   FROM THE DAY IT WAS ADDED — which teaches whoever reads it that red is what
#   this job looks like, and that is how a real failure scrolls past unread.
#   It was also measuring the wrong thing: AGENTS.md's rule is "zero NEW
#   findings against the recorded baseline", not "zero findings", so the rule
#   was satisfied while the gate failed. The gate was wrong, not the code.
#   The accepted residual lives in ONE place — .eslint-baseline.json — and the
#   ratchet only ever lets it fall. See scripts/lint-ratchet.mjs.
#   2. A mirrored-register CHANGE DETECTOR. public/ial-inns.json and
#      public/mkb10.json are the CANONICAL copies; the backend carries mirrors.
#
# ⚠ The byte-identity comparison does NOT happen in this repo (2026-08-20).
#   It used to claim to: a job named „Register mirror byte-identity" showed a
#   green tick on every push while its `cmp` had never executed once, because
#   SIBLING_REPO_TOKEN was never set and the fallback branch exited 0. A check
#   that cannot fail reports identically to a check that passed.
#   This side genuinely cannot do it — tubermed-backend is private. The check
#   moved to the side that can do it for free: this repo is PUBLIC, so the
#   backend reads the canon from raw.githubusercontent with no token and runs
#   `scripts/verify-mirror.js` on every push, fail-closed and self-testing.
#   Byte-identity is symmetric, so one side proving it is enough.
#   What remains here reports only what it actually establishes.
#
# Node 24: the test script (`node --test scripts/*.test.ts`) needs native
# type-stripping; verified locally on v24.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No new lint findings vs .eslint-baseline.json (a ratchet — it only falls).
      - run: npm run lint:ratchet
      - run: npx tsc --noEmit
      - run: npm test

  # ── This job no longer claims to verify byte-identity (2026-08-20) ─────────
  # It used to be called „Register mirror byte-identity" and reported a GREEN
  # TICK on every push while its `cmp` never ran once: SIBLING_REPO_TOKEN has
  # never been set, so the real steps were `if`-ed out and the fallback branch
  # exited 0. A check that cannot fail reports identically to a check that
  # passed — the vacuous-gate shape, in the gate guarding the register copies.
  #
  # This side genuinely cannot do the comparison: tubermed-backend is PRIVATE,
  # so without a credential there is no way to read its mirror. Rather than
  # pretend, the work moved to the side that CAN do it for free — tubermed-web
  # is public, so tubermed-backend reads this repo's canon from
  # raw.githubusercontent with no token and runs the real gate on every backend
  # push (`scripts/verify-mirror.js`). Byte-identity is symmetric.
  #
  # What is left here is honestly named: a CHANGE DETECTOR. It reports only what
  # it actually established — whether this push touched a mirrored file — and it
  # HARD-FAILS when one changed and cannot be verified from this side, because a
  # change to the canon is exactly when drift is introduced.
  mirror-change-detector:
    name: Mirrored register change (verification lives in tubermed-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mirrored-file changes
        id: changes
        run: |
          set -u
          # public/sentry-scrub-contract.json (2026-08-30) is the canonical Sentry
          # scrub contract; tubermed-backend carries lib/sentry-scrub-contract.json
          # and each repo executes its own implementation against its own copy.
          MIRROR_FILES="public/ial-inns.json public/mkb10.json public/sentry-scrub-contract.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50 || true
            range="$(git merge-base "origin/${{ github.base_ref }}" HEAD)..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            range="HEAD^..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          mirror_changed=$(git diff --name-only "$range" -- $MIRROR_FILES 2>/dev/null) \
            || mirror_changed=$(git diff --name-only HEAD^..HEAD -- $MIRROR_FILES)
          echo "mirror_changed=$([ -n "$mirror_changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "range: $range"
          echo "mirrored files changed: ${mirror_changed:-none}"
      # A mirrored file changed HERE, in the canon. This side cannot verify the
      # backend followed — so it fails, loudly, rather than reporting a green
      # tick for a verification that did not happen. Clearing it means landing
      # the matching backend commit, whose own CI runs the real byte-identity
      # gate tokenlessly and will go red until both sides agree.
      - name: A mirrored register file changed — verify from tubermed-backend
        if: steps.changes.outputs.mirror_changed == 'true'
        run: |
          echo "::error::A mirrored file (public/ial-inns.json, public/mkb10.json, public/sentry-scrub-contract.json) changed in this push. This repo CANNOT verify byte-identity — tubermed-backend is private. Land the matching commit in tubermed-backend; its CI runs 'node scripts/verify-mirror.js' against this repo's canon with no token and will fail until the two agree."
          exit 1
      # Nothing was claimed about byte-identity, so nothing false is reported.
      - name: No mirrored file changed in this push
        if: steps.changes.outputs.mirror_changed != 'true'
        run: |
          echo "::notice::No mirrored register file changed in this push. This job asserts ONLY that — byte-identity is verified in tubermed-backend CI (scripts/verify-mirror.js), which runs on every backend push with no credential."
